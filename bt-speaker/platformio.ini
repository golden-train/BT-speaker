; PlatformIO Project Configuration File
; ESP32 智能蓝牙音箱 — 阶段任务 P2（架构重构 + 控制接口 + OLED 显示）
;
; P2 目标：
;   1. main.cpp 精简为初始化 + 轮询
;   2. 预留控制接口（USB/串口 JON 行协议；WiFi TCP 接口预留）
;   3. OLED 显示（歌名 / 音量条 / EQ / BT 状态 / 电量占位）
; 参考文档：esp32-bt-speaker-design.md

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; ---------- 分区表 ----------
; 默认 default.csv 的 app 区只有 1.25 MiB（P2 之后不够）。
; huge_app.csv = 3 MiB 单 app（放弃 OTA 双区），P2~P8 空间充足。
board_build.partitions = huge_app.csv

; ---------- 依赖库 ----------
; ESP32-A2DP：未收录在 PlatformIO 官方 registry，用 GitHub 地址。
;   v1.8.x 需要 ESP-IDF ≥ 5.0，本机 Arduino 2.0.17 (IDF 4.4.7) → 锁 v1.7.4。
lib_deps =
    https://github.com/pschatzmann/ESP32-A2DP.git#v1.7.4
    bblanchon/ArduinoJson@^6.21.5
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit BusIO@^1.16.1
    mathertel/RotaryEncoder@^1.6.0
    ; P6 SD 播放：MP3/FLAC/WAV 解码
    earlephilhower/ESP8266Audio@^1.9.7

; ---------- 编译选项 ----------
; CORE_DEBUG_LEVEL=0：关掉 ESP_LOG，避免库日志污染串口 JSON 行协议。
; 调试期可临时改回 2（宿主端过滤非 '{' 开头的行），或加 -D SPEAKER_DEBUG 用项目内打印门。
build_flags =
    -D CORE_DEBUG_LEVEL=0
    ; -D SPEAKER_DEBUG
    ; -D SPEAKER_ENABLE_WIFI_TRANSPORT

; ---------- 烧录/监控 ----------
monitor_speed = 115200
